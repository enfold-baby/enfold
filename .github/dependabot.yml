version: 2
updates:
  - package-ecosystem: pub
    directory: /
    schedule:
      interval: monthly
    groups:
      flutter:
        patterns: ["*"]
  - package-ecosystem: pip
    directory: /backend
    schedule:
      interval: monthly
    groups:
      backend:
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
