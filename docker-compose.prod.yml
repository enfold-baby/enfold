# Bloomdue production stack for the VPS running Nginx Proxy Manager.
# Use: docker compose -f docker-compose.prod.yml up -d --build
services:
  postgres:
    image: postgres:16-alpine
    container_name: bloomdue-postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - internal

  redis:
    image: redis:7-alpine
    container_name: bloomdue-redis
    restart: always
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - internal

  landing:
    build:
      context: ./landing
      dockerfile: Dockerfile
    container_name: bloomdue-landing
    restart: always
    expose:
      - "3000"
    networks:
      - proxy

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    container_name: bloomdue-backend
    restart: always
    environment:
      - TZ=Europe/Bucharest
    env_file: .env
    expose:
      - "8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: sh -c "alembic upgrade head && gunicorn app.main:app -k uvicorn.workers.UvicornWorker --workers 2 --bind 0.0.0.0:8000 --access-logfile -"
    networks:
      - internal
      - proxy

volumes:
  postgres_data:
    name: bloomdue_app_postgres_data
  redis_data:
    name: bloomdue_app_redis_data

networks:
  internal:
    driver: bridge
  proxy:
    external: true
    name: ${PROXY_NETWORK:-npm_network}
