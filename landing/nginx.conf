server {
    listen 3000;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Behind NPM/HTTPS proxy: never advertise container port 3000 in redirects.
    absolute_redirect off;
    port_in_redirect off;

    location = /help { return 301 /support/; }
    location = /help/ { return 301 /support/; }

    error_page 404 /404.html;
    location = /404.html { internal; }

    location / {
        try_files $uri $uri/ =404;
    }
}
