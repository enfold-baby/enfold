# Enfold development stack. Use: docker compose up --build
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "8285:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - bloomdue_network

  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data
    ports:
      - "8286:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - bloomdue_network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      - TZ=Europe/Bucharest
    env_file: .env
    ports:
      - "8282:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    networks:
      - bloomdue_network

  # Static marketing site (volume-mounted for live HTML/CSS edits).
  landing:
    build:
      context: ./landing
      dockerfile: Dockerfile
    ports:
      - "8283:3000"
    volumes:
      - ./landing/public:/usr/share/nginx/html:ro
      - ./landing/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - bloomdue_network

  caddy:
    image: caddy:2-alpine
    environment:
      - SITE_ADDRESS=${SITE_ADDRESS:-http://localhost:8280}
    depends_on:
      - backend
      - landing
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    ports:
      - "8280:80"
    networks:
      - bloomdue_network

volumes:
  postgres_data:
    name: bloomdue_postgres_data
  redis_data:
    name: bloomdue_redis_data
  caddy_data:
    name: bloomdue_caddy_data
  caddy_config:
    name: bloomdue_caddy_config

networks:
  bloomdue_network:
    driver: bridge
